name: build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    # Windows is in the matrix because the spawn path there is the one piece of
    # behaviour that cannot be checked by cross-compiling on Linux.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true
      - name: gofmt
        if: matrix.os == 'ubuntu-latest'
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "needs gofmt:"; echo "$unformatted"; exit 1
          fi
      - run: go vet ./...
      - name: vet the windowless build
        if: matrix.os == 'ubuntu-latest'
        env:
          GOOS: windows
        run: go vet -tags windowsgui ./...
      - run: go test -v ./...

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true
      - name: Work out the version
        id: version
        run: |
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-${GITHUB_REF_NAME//\//-}-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          fi
      - run: scripts/build.sh "${{ steps.version.outputs.version }}"
      # Uploaded on every run, so a binary is downloadable from the Actions tab
      # without cutting a release first.
      - uses: actions/upload-artifact@v4
        with:
          name: exe-env-wrapper-${{ steps.version.outputs.version }}
          path: dist/
          if-no-files-found: error

  release:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: exe-env-wrapper-*
          merge-multiple: true
          path: dist
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
